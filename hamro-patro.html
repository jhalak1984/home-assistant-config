<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f5ef" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://jhalakrai.com/hamro-patro.html" />
    <meta name="description" content="Hamro Patro, a Nepali Bikram Sambat calendar with a bilingual date view and private local events." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hamro Patro | Nepali Calendar" />
    <meta property="og:description" content="A bilingual Nepali Bikram Sambat calendar with Gregorian dates and private local events." />
    <meta property="og:url" content="https://jhalakrai.com/hamro-patro.html" />
    <title>Hamro Patro | Nepali Calendar</title>
    <link rel="icon" type="image/png" href="jr-mark.png" />
    <link rel="stylesheet" href="hamro-patro.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <a class="brand" href="index.html" aria-label="Hamro Patro home">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="brand-copy"><strong>hamro <b>patro</b></strong><small>NEPALI CALENDAR</small></span>
        </a>
        <div class="header-actions">
          <a class="back-link" href="index.html">Jhalak Rai <span aria-hidden="true">↗</span></a>
          <button id="languageToggle" class="icon-button language-button" type="button" aria-label="Switch to Nepali">नेपाली</button>
        </div>
      </header>

      <main>
        <section class="welcome-row" aria-label="Today's date">
          <div>
            <p class="eyebrow" id="todayWeekday">YOUR DAY, IN NEPAL</p>
            <h1 id="todayBs">Loading calendar…</h1>
            <p class="today-ad" id="todayAd"></p>
          </div>
          <button class="today-button" id="todayButton" type="button">Today <span aria-hidden="true">↗</span></button>
        </section>

        <section class="calendar-layout" aria-label="Calendar and selected day">
          <div class="calendar-panel">
            <div class="calendar-toolbar">
              <div class="month-heading">
                <h2 id="monthTitle">Calendar</h2>
                <span id="monthSubtitle"></span>
              </div>
              <div class="calendar-controls">
                <button class="icon-button" id="previousMonth" type="button" aria-label="Previous month">←</button>
                <button class="icon-button" id="nextMonth" type="button" aria-label="Next month">→</button>
                <button class="add-button" id="addEventButton" type="button"><span aria-hidden="true">＋</span><span class="add-label">Add event</span></button>
              </div>
            </div>
            <div class="weekdays" id="weekdays" aria-hidden="true"></div>
            <div class="calendar-grid" id="calendarGrid" role="grid" aria-labelledby="monthTitle"></div>
            <div class="calendar-legend"><span><i class="legend-dot today-dot"></i><span id="legendToday">Today</span></span><span><i class="legend-dot event-dot"></i><span id="legendEvent">Personal event</span></span></div>
          </div>

          <aside class="day-panel" aria-live="polite">
            <div class="day-panel-top"><p class="eyebrow" id="selectedWeekday">SELECTED DAY</p><button class="text-button" id="addSelectedEvent" type="button">＋ Add</button></div>
            <h2 id="selectedDate">Choose a date</h2>
            <p class="selected-ad" id="selectedAd"></p>
            <div class="day-divider"></div>
            <h3><span id="dayPanelTitle">Your plans</span><span id="eventCount"></span></h3>
            <div id="eventList" class="event-list"></div>
            <p class="privacy-note"><span aria-hidden="true">◉</span><span id="privacyText">Your events stay on this device.</span></p>
          </aside>
        </section>
        <p class="date-note" id="dateNote" role="status"></p>
      </main>

      <footer class="app-footer"><span>hamro patro <b>·</b> हाम्रो पात्रो</span><a href="index.html">Back to Jhalak Rai <span aria-hidden="true">↗</span></a></footer>
    </div>

    <dialog id="eventDialog" class="event-dialog" aria-labelledby="dialogTitle">
      <form id="eventForm" method="dialog">
        <div class="dialog-heading"><div><p class="eyebrow">MAKE A NOTE</p><h2 id="dialogTitle">Add an event</h2></div><button id="closeDialog" class="icon-button close-button" type="button" aria-label="Close">×</button></div>
        <label for="eventTitle">Event name</label>
        <input id="eventTitle" name="title" maxlength="80" placeholder="e.g. Call home" required />
        <label for="eventDate">Date</label>
        <input id="eventDate" name="date" type="date" required />
        <label for="eventNote"><span id="eventNoteLabel">Note</span> <span id="eventOptionalLabel">Optional</span></label>
        <textarea id="eventNote" name="note" rows="3" maxlength="240" placeholder="A little more detail…"></textarea>
        <div class="dialog-actions"><button class="cancel-button" id="cancelDialog" type="button">Cancel</button><button class="save-button" type="submit"><span id="saveEventLabel">Save event</span><span aria-hidden="true">↗</span></button></div>
      </form>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/nepali-date-converter@3.4.0/dist/nepali-date-converter.umd.js"></script>
    <script src="hamro-patro.js"></script>
  </body>
</html>
