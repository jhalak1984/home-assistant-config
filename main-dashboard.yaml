                        isClosedColor: black
                        buttonInactiveColor: white
                        customSetpoints: true
                        openPosition: 85
                        midOpenPosition: 55
                        midClosePosition: 40
                        closePosition: 25
                        customText: false
  - type: custom:masonry-layout
    path: ''
    icon: mdi:server-network
    theme: montserrat
    cards:
      - type: custom:hui-entities-card
        title: HomeLab 1 - INTERNAL_HOST
        show_header_toggle: 'off'
        style: |
          ha-card { border-radius: 20px; }
        entities:
          - type: custom:hui-vertical-stack-card
            cards:
              - type: horizontal-stack
                cards:
                  - type: picture
                    style: |
                      ha-card { 
                          --paper-card-background-color: 'rgba(0, 0, 0, 0.0)';
                          --ha-card-background: "rgba(0, 0, 0, 0.0)";
                          --ha-card-box-shadow: 'none';
                      }
                    image: /local/Proxmox.png
                  - type: custom:button-card
                    layout: icon_name_state2nd
                    show_icon: true
                    show_state: true
                    styles:
                      grid:
                        - grid-template-columns: 50px auto
                      icon:
                        - padding: 20px 10px
                        - height: 30px
                        - width: 30px
                      card:
                        - --ha-card-background: rgba(0, 0, 0, 0.0)
                        - --ha-card-box-shadow: none
                      state:
                        - padding: 0px 10px
                        - justify-self: start
                        - font-family: Roboto, sans-serif
                        - font-size: 15px
                      name:
                        - padding: 0px 10px
                        - justify-self: start
                        - color: var(--secondary-text-color)
                    entity: sensor.homelab_1_current_consumption
                    name: Power Consumed
                    icon: mdi:power-plug
              - type: custom:mini-graph-card
                entities:
                  - entity: sensor.homelab_1_cpu_usage
                name: CPU Usage
                height: 50
                line_width: 2
                font_size: 80
                hours_to_show: 4
                points_per_hour: 90
                show:
                  icon: false
                  extrema: true
                color_thresholds:
                  - value: 28
                    color: '#e74c3c'
                  - value: 15
                    color: '#1db954'
                  - value: 0
                    color: '#3498db'
                style: |
                  ha-card { 
                      --paper-card-background-color: 'rgba(0, 0, 0, 0.0)';
                      --ha-card-background: "rgba(0, 0, 0, 0.0)";
                      --ha-card-box-shadow: 'none';
                  }
              - type: custom:bar-card
                title_position: inside
                name: 'OS Disk usage: 100 GB'
                show_icon: true
                align: split
                columns: 1
                max: 100
                unit_of_measurement: GB
                severity:
                  - value: 50
                    color: '#3498db'
                  - value: 75
                    color: '#f39c12'
                  - value: 100
                    color: '#e45e65'
                style: |
                  ha-card { 
                    --paper-card-background-color: 'rgba(0, 0, 0, 0.0)';
                    --ha-card-background: "rgba(0, 0, 0, 0.0)";
                    --ha-card-box-shadow: 'none';
                  }
                entity: sensor.homelab_1_disk_used
