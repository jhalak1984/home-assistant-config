background: center / cover no-repeat url("/local/space.png") fixed
kiosk_mode:
  admin_settings:
    hide_header: false
views:
  - theme: montserrat
    path: home
    icon: mdi:home
    type: custom:masonry-layout
    badges: []
    cards:
      - type: custom:weather-chart-card
        entity: weather.forecast_home
        show_main: true
        show_temperature: true
        show_current_condition: true
        show_attributes: true
        show_time: true
        show_time_seconds: false
        show_day: true
        show_date: true
        show_humidity: true
        show_pressure: true
        show_wind_direction: true
        show_wind_speed: true
        show_sun: true
        show_feels_like: false
        show_dew_point: false
        show_wind_gust_speed: false
        show_visibility: false
        show_last_changed: true
        use_12hour_format: false
        icons_size: 25
        animated_icons: true
        icon_style: style1
        autoscroll: false
        forecast:
          precipitation_type: rainfall
          show_probability: false
          labels_font_size: '11'
          precip_bar_size: '100'
          style: style1
          show_wind_forecast: true
          condition_icons: true
          round_temp: false
          type: daily
          number_of_forecasts: '0'
          disable_animation: false
        units:
          speed: ''
        title: Example location
      - type: custom:power-flow-card-plus
        entities:
          home:
            entity: sensor.foxess_load_power
            color_icon: solar
            secondary_info: {}
          grid:
            icon: mdi:transmission-tower
            name: Grid
            entity:
              production: sensor.foxess_feedin_power
              consumption: sensor.foxess_grid_consumption_power
            secondary_info: {}
          solar:
            icon: mdi:solar-power-variant
            entity: sensor.foxess_pv_power
            secondary_info: {}
          battery:
            name: Battery
            icon: mdi:battery-high
            entity:
              consumption: sensor.foxess_bat_discharge_power
              production: sensor.foxess_bat_charge_power
            state_of_charge: sensor.foxess_bat_soc
          individual:
            - entity: sensor.heating_gas_power
              name: Heating
              icon: mdi:radiator
              color: '#ff9800'
              color_icon: true
              display_zero: true
              display_zero_state: false
              secondary_info:
                template: >
                  £{{ states('sensor.heating_gas_cost_today') | float(0) |
                  round(2) }}
                display_zero: true
            - entity: sensor.dhw_gas_power
              name: Hot Water
              icon: mdi:water-pump
              color: '#38bdf8'
              color_icon: true
              display_zero: true
              display_zero_state: false
              secondary_info:
                template: >
                  £{{ states('sensor.dhw_gas_cost_today') | float(0) | round(2)
                  }}
                display_zero: true
            - entity: sensor.server_rack_current_consumption
              name: Server Rack
              icon: mdi:server-network
              color: '#a78bfa'
              color_icon: true
              display_zero: true
            - entity: sensor.ohme_home_pro_power
              name: Car
              icon: mdi:car-electric
              color: '#ff8080'
              color_icon: true
              display_zero: true
        min_flow_rate: 0.9
        max_flow_rate: 6
        clickable_entities: true
        title: Energy
        kilo_threshold: 10000
        base_decimals: 0
        kilo_decimals: 2
      - type: custom:alarmo-card
        entity: alarm_control_panel.alarmo
        use_clear_icon: false
        button_scale_actions: 1
        button_scale_keypad: 1
        name: Alarm Panel
      - type: custom:vertical-stack-in-card
        cards:
          - type: entities
            entities:
              - entity: switch.front_door_light
          - type: picture
            image: https://demo.home-assistant.io/stub_config/t-shirt-promo.png
            image_entity: image.front_door_event_image
      - type: custom:webrtc-camera
        entity: camera.front_entrance_fluent
      - type: custom:restriction-card
        duration: 10
        restrictions:
          confirm:
            text: Unlock controls
        card:
          type: thermostat
          entity: climate.central_heating
          name: Central Heating
          features:
            - type: climate-hvac-modes
              hvac_modes:
                - 'off'
                - heat
          show_current_as_primary: false
      - type: vertical-stack
        cards:
          - type: gauge
            entity: >-
              sensor.octopus_energy_electricity_example_meter_current_demand
            min: -8000
            max: 20000
            needle: true
            severity:
              green: 8
              yellow: 0
              red: 0
            name: 'Live From Grid '
          - type: gauge
            entity: >-
              sensor.octopus_energy_electricity_example_meter_export_previous_accumulative_cost
            name: Previous Day Export
            needle: false
      - type: horizontal-stack
        title: Bin Collection
        cards:
          - type: vertical-stack
            cards:
              - type: custom:config-template-card
                entities:
                  - sensor.white_bin_collection
                variables:
                  DAYS: >-
                    states['sensor.white_bin_collection'].attributes['Days'] ==
                    0 ? 'Today' :
                    states['sensor.white_bin_collection'].attributes['Days'] ==
                    1
                      ? 'Tomorrow'
                      : states['sensor.white_bin_collection'].attributes['Days'] + ' days'
                card:
                  type: picture-entity
                  entity: sensor.white_bin_collection
                  name: ${DAYS}
                  show_name: true
                  show_state: false
                  image: /local/whitetop.png
              - type: custom:config-template-card
                entities:
                  - sensor.blue_bin_collection
                variables:
                  DAYS: >-
                    states['sensor.blue_bin_collection'].attributes['Days'] == 0
                    ? 'Today' :
                    states['sensor.blue_bin_collection'].attributes['Days'] == 1
                      ? 'Tomorrow'
                      : states['sensor.blue_bin_collection'].attributes['Days'] + ' days'
                card:
                  type: picture-entity
                  entity: sensor.blue_bin_collection
                  name: ${DAYS}
                  show_name: true
                  show_state: false
                  image: /local/bluetop.png
          - type: vertical-stack
            cards:
              - type: custom:config-template-card
                entities:
                  - sensor.green_bin_collection
                variables:
                  DAYS: >-
                    states['sensor.green_bin_collection'].attributes['Days'] ==
                    0 ? 'Today' :
                    states['sensor.green_bin_collection'].attributes['Days'] ==
                    1
                      ? 'Tomorrow'
                      : states['sensor.green_bin_collection'].attributes['Days'] + ' days'
                card:
                  type: picture-entity
                  entity: sensor.green_bin_collection
                  name: ${DAYS}
                  show_name: true
                  show_state: false
                  image: /local/greentop.png
              - type: custom:config-template-card
                entities:
                  - sensor.brown_bin_collection
                variables:
                  DAYS: >-
                    states['sensor.brown_bin_collection'].attributes['Days'] ==
                    0 ? 'Today' :
                    states['sensor.brown_bin_collection'].attributes['Days'] ==
                    1
                      ? 'Tomorrow'
                      : states['sensor.brown_bin_collection'].attributes['Days'] + ' days'
                card:
                  type: picture-entity
                  entity: sensor.brown_bin_collection
                  name: ${DAYS}
                  show_name: true
                  show_state: false
                  image: /local/browntop.png
      - type: horizontal-stack
        cards:
          - graph: line
            type: sensor
            entity: sensor.power_production_now_2
            detail: 1
            name: Now
          - type: custom:vertical-stack-in-card
            cards:
              - type: horizontal-stack
                cards:
                  - graph: line
                    type: sensor
                    entity: sensor.energy_production_tomorrow_2
                    detail: 1
                    name: Tomorrow
              - graph: line
                type: sensor
                entity: sensor.energy_production_today_2
                detail: 1
                name: Today
        title: Solar Forecast
      - type: custom:stack-in-card
        title: Smoke Detector
        mode: vertical
        cards:
          - type: horizontal-stack
            cards:
              - type: entity
                name: Bedroom
                entity: binary_sensor.lumi_lumi_sensor_smoke_e40b2d05_ias_zone
              - type: entity
                name: Kitchen
                entity: binary_sensor.kitchen_smoke_detector_smoke
      - type: vertical-stack
        cards:
          - type: custom:fr24-card
            entity: sensor.fr24_aircraft
            title: Flightradar24
            popup: true
          - type: vertical-stack
            cards:
              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: sensor.flightradar24_current_in_area
                    above: 0
                card:
                  type: markdown
                  content: >-
                    {% set data =
                    state_attr('sensor.flightradar24_current_in_area',
                    'flights') %} {% for flight in data %}
                      <ha-icon icon="mdi:airplane"></ha-icon>{{ flight.flight_number }}({{ flight.aircraft_registration }}) - {{ flight.airline_short }} - {{ flight.aircraft_model }}
                      {{ flight.airport_origin_city }}{%if flight.airport_origin_city %}<img src="https://flagsapi.com/{{ flight.airport_origin_country_code }}/shiny/16.png" title='{{ flight.airport_origin_country_name }}'/>{% endif %} -> {{ flight.airport_destination_city }}{%
                      if flight.airport_destination_country_code %}<img src="https://flagsapi.com/{{ flight.airport_destination_country_code }}/shiny/16.png" title='{{ flight.airport_destination_country_name }}'/>{% endif %}
                      {%if flight.time_scheduled_departure %}Departure - {{ flight.time_scheduled_departure | timestamp_custom('%H:%M') }}; {% endif %}{%if flight.time_scheduled_arrival%}Arrival - {{ flight.time_scheduled_arrival | timestamp_custom('%H:%M') }}{% endif %}
                      Altitude - {{ flight.altitude }} ft{%if flight.altitude > 0 %} ({{(flight.altitude * 0.3048)| round(0)}} m){% endif%}; Gr. speed - {{ flight.ground_speed }} kts{%if flight.ground_speed > 0 %} ({{(flight.ground_speed * 1.852)| round(0)}} km/h){% endif%}
                      {% endfor %}
              - type: iframe
                url: >-
                  https://www.flightradar24.com/simple?lat=0&lon=0&z=10&label1=reg&size=small
                aspect_ratio: 100%
      - type: custom:stack-in-card
        title: Lights
        mode: vertical
        cards:
          - type: horizontal-stack
            cards:
              - type: button
                name: Bedside Lamp
                entity: light.bedside_lamp
              - type: button
                name: Living Room
                entity: light.living_room_lights_switch
          - type: horizontal-stack
            cards:
              - type: button
                name: Bedroom
                entity: light.lumi_lumi_ctrl_neutral1_c41a5e04_on_off
              - type: button
                name: Computer Room
                entity: light.computer_room_lights
          - type: horizontal-stack
            cards:
              - type: button
                name: Entrance Lights
                entity: light.entrance_lights
              - type: button
                name: Landing Light
                entity: light.landing_light
          - type: horizontal-stack
            cards:
              - type: button
                name: Stairs Lights
                entity: light.stairs_lights
              - type: button
                name: Guest Room Light
                entity: light.landing_light
      - type: vertical-stack
        cards:
          - vehicle_image_type: upload
            status_image_type: none
            layout_type: single
            formatted_entities: false
            show_location: true
            show_mileage: true
            show_car_state: true
            show_info_icons: true
            help_highlight: true
            sections_order:
              - title
              - image
              - info
              - info_row_j3kzulp
            bars: []
            icon_rows: []
            title: Nissan Leaf
            image_url: /local/example-vehicle.png
            charging_image_url: ''
            image_url_type: image
            charging_image_url_type: entity
            vehicle_type: EV
            unit_type: mi
            level_entity: ''
            range_entity: ''
            charging_status_entity: binary_sensor.ohme_home_pro_car_connected
            location_entity: ''
            mileage_entity: ''
            show_level: true
            show_range: true
            show_charge_limit: true
            icon_grid_entities: []
            custom_icons: {}
            icon_interactions: {}
            icon_styles: {}
            icon_labels: {}
            hybrid_display_order: fuel_first
            car_state_entity: binary_sensor.ohme_home_pro_car_connected
            charge_limit_entity: ''
            icon_size: 24
            icon_gap: 12
            showEntityInformation: true
            carStateTextColor: ''
            rangeTextColor: ''
            percentageTextColor: ''
            icon_sizes: {}
            engine_on_entity: ''
            row_separator_color: Default
            row_separator_height: 1
            row_separators: {}
            iconActiveColor: '#2980b9'
            iconInactiveColor: '#cecece'
            useFormattedEntities: false
            mainImageHeight: 250px
            chargingImageHeight: 140px
            showTitle: true
            layoutType: single
            useBarGradient: false
            barGradientStops:
              - percentage: 0
                color: '#ff0000'
              - percentage: 100
                color: '#00ff00'
            cardTitleColor: ''
            cardBackgroundColor: ''
            barBackgroundColor: ''
            barBorderColor: ''
            barFillColor: ''
            limitIndicatorColor: ''
            infoTextColor: ''
            show_engine_animation: false
            show_charging_animation: false
            show_charging_status: true
            show_engine_on: true
            engine_on_image_url_type: none
            type: custom:ultra-vehicle-card
            battery_level_entity: sensor.ohme_home_pro_battery_soc
            battery_range_entity: ''
            fuel_level_entity: ''
            fuel_range_entity: ''
            show_battery: true
            show_battery_range: true
            show_fuel: true
            show_fuel_range: true
            show_charging: true
            charging_image_entity: binary_sensor.ohme_home_pro_car_charging
            image_entity: ''
            vehicle_image_width: 100
            action_image_width: 100
            vehicle_image: /local/example-vehicle.png
            info_rows:
              - id: j3kzulp
                info_entities:
                  - id: dlu7ifi
                    entity: binary_sensor.ohme_home_pro_car_connected
                    name: ''
                    show_icon: false
                    icon: mdi:car-info
                    text_color: ''
                    show_name: false
                alignment: left
                spacing: medium
            images:
              - id: h1jlati
                name: Vehicle Image
                image_type: upload
                image: /local/example-vehicle.png
                image_width: 100
                priority: 0
            image_priority_mode: order
          - type: custom:charger-card
            brand: other
            entity: binary_sensor.ohme_home_pro_charger_online
            customImage: /local/ohme1.png
            customCardTheme: theme_custom
            chargerImage: White
            show_leds: true
            show_collapsibles: false
            details:
              name:
                entity_id: binary_sensor.ohme_home_pro_car_connected
                attribute: name
              location:
                entity_id: binary_sensor.ohme_home_pro_car_charging
                attribute: site_name
              status:
                entity_id: binary_sensor.ohme_home_pro_car_charging
              statetext:
                'off': Idle
                'on': Charging
              info_left:
                - entity_id: sensor.ohme_home_pro_power_draw
                  text: power
                  unit_show: true
              info_right:
                - entity_id: sensor.ohme_home_pro_voltage
                  text: voltage
                  unit_show: true
              stats:
                default:
                  - entity_id: calculated
                    calc_function: sum
                    calc_entities:
                      - entity_id: sensor.32a_car_charging_session_step_1
                      - entity_id: sensor.32a_car_charging_session_step_2
                    text: This Session
                    unit_show: true
                    unit: kWh
                    round: 1
                  - entity_id: calculated
                    calc_function: sum
                    calc_entities:
                      - entity_id: input_number.32a_car_charger_last_session_step_1
                      - entity_id: input_number.32a_car_charger_last_session_step_2
                    text: Last Session
                    unit_show: true
                    unit: kWh
                    round: 1
                  - entity_id: calculated
                    calc_function: sum
                    calc_entities:
                      - entity_id: sensor.32a_car_charger_monthly_energy_step_1
                      - entity_id: sensor.32a_car_charger_monthly_energy_step_2
                    text: This Month
                    unit_show: true
                    unit: kWh
                    round: 1
            show_toolbar: false
            show_stats: false
            show_status: true
            show_name: false
            card_mod:
              class: inline-card
      - show_name: true
        show_icon: true
        type: button
        entity: lock.front_door
        icon: mdi:door-closed-lock
        show_state: true
        name: 'Main Door Lock '
      - type: custom:stack-in-card
