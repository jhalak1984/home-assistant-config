                      confirm:
                        text: Unlock controls
                    card:
                      type: custom:shutter-card
                      title: null
                      entities:
                        - entity: cover.bedroom_blind_window_covering
                          name: Bedroom Blind
                          buttons_position: left
                          title_position: bottom
                          invert_percentage: false
          - type: vertical-stack
            cards:
              - type: horizontal-stack
                cards:
                  - show_name: false
                    show_icon: true
