              - type: entity
                name: Living Room
                entity: binary_sensor.lumi_lumi_sensor_magnet_aq2_8a724e04_on_off
      - type: vertical-stack
        title: Sensors
        cards:
          - type: horizontal-stack
            cards:
              - type: custom:mini-graph-card
                name: Living Room
                entities:
                  - sensor.switchbot_meter1_temp
                line_color: blue
                line_width: 8
                font_size: 75
              - type: custom:mini-graph-card
                name: Living Room
                entities:
                  - sensor.switchbot_meter1_humidity
                line_color: '#e74c3c'
                line_width: 8
                font_size: 75
          - type: horizontal-stack
            cards:
              - type: custom:mini-graph-card
                name: Kitchen
                entities:
                  - sensor.switchbot_meter_temp
                line_color: purple
                line_width: 8
                font_size: 75
              - type: custom:mini-graph-card
                name: Kitchen
                entities:
                  - sensor.switchbot_meter_humidity
                line_color: indigo
                line_width: 8
                font_size: 75
          - type: horizontal-stack
            cards:
              - type: custom:mini-graph-card
                name: Bedroom
                entities:
                  - sensor.lumi_lumi_weather_bd674c05_temperature
                line_color: blue
                line_width: 8
                font_size: 75
              - type: custom:mini-graph-card
                name: Bedroom
                entities:
                  - sensor.lumi_lumi_weather_bd674c05_humidity
                line_color: '#e74c3c'
                line_width: 8
                font_size: 75
          - type: horizontal-stack
            cards:
              - type: custom:mini-graph-card
                name: Computer Room
                entities:
                  - sensor.lumi_lumi_weather_temperature
                line_color: purple
                line_width: 8
                font_size: 75
              - type: custom:mini-graph-card
                name: Computer Room
                entities:
                  - sensor.lumi_lumi_weather_humidity
                line_color: indigo
                line_width: 8
                font_size: 75
          - type: horizontal-stack
            cards:
              - type: custom:mini-graph-card
                name: Bathroom
                entities:
                  - sensor.lumi_lumi_weather_temperature_3
                line_color: blue
                line_width: 8
                font_size: 75
              - type: custom:mini-graph-card
                name: Bathroom
                entities:
                  - sensor.lumi_lumi_weather_humidity_3
                line_color: '#e74c3c'
                line_width: 8
                font_size: 75
          - type: horizontal-stack
            cards:
              - type: custom:mini-graph-card
                name: Toilet
                entities:
                  - sensor.outside_toilet_temp_humidity_sensor_temperature_2
                line_color: purple
                line_width: 8
                font_size: 75
              - type: custom:mini-graph-card
                name: Toilet
                entities:
                  - sensor.outside_toilet_temp_humidity_sensor_humidity_2
                line_color: indigo
                line_width: 8
                font_size: 75
      - type: glance
        entities:
          - entity: sensor.fire_tablet_battery
          - entity: binary_sensor.fire_tablet_plugged_in
      - type: vertical-stack
        cards:
          - type: vertical-stack
            cards:
              - square: false
                columns: 2
                type: grid
                cards:
                  - type: custom:restriction-card
                    duration: 10
                    restrictions:
                      confirm:
                        text: Unlock controls
                    card:
                      type: custom:shutter-card
                      title: null
                      entities:
                        - entity: cover.living_room_blind_window_covering
